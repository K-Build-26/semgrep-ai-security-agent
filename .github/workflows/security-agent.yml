name: AI Security Agent Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  security-agent-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai semgrep pydantic

      - name: Run Agentic Security Scan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python security_agent.py

      - name: Publish Security Report to GitHub Summary
        if: always()
        run: |
          if [ -f security_report.md ]; then
            cat security_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post Comment on Pull Request
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('security_report.md')) {
              const report = fs.readFileSync('security_report.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: report
              });
            }
